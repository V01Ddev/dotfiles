# Fixes colors
set-option -sa terminal-overrides ",xterm*:Tc"

# Set the control character to Ctrl+Spacebar (instead of Ctrl+B)
set -g prefix C-space
unbind-key C-b
bind-key C-space send-prefix

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Using VI keybindings
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Copy to the system clipboard via OSC 52 (Konsole supports it; no xclip needed)
bind-key -T copy-mode-vi Enter send -X copy-selection-and-cancel
 
# Colors come from the terminal's ANSI palette, so the scheme lives only in
# Konsole (see ../konsole/). 0 = overlay, 5 = iris, 7 = text, 8 = muted.
set -g status-style "bg=colour0,fg=colour7"
set -g status-left-style "bg=colour5,fg=colour0,bold"
set -g window-status-style "fg=colour8"
set -g window-status-current-style "bg=colour5,fg=colour0,bold"

# Enabling mouse
set -g mouse on 
