<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<fontconfig>
 <!-- Artificial oblique for fonts without italic/oblique -->
 <match target="font">
  <test name="slant">
   <const>roman</const>
  </test>
  <test compare="not_eq" name="slant" target="pattern">
   <const>roman</const>
  </test>
  <edit mode="assign" name="matrix">
   <times>
    <name>matrix</name>
    <matrix>
     <double>1</double>
     <double>0.2</double>
     <double>0</double>
     <double>1</double>
    </matrix>
   </times>
  </edit>
  <edit mode="assign" name="slant">
   <const>oblique</const>
  </edit>
  <edit mode="assign" name="embeddedbitmap">
   <bool>false</bool>
  </edit>
 </match>
 <!-- Synthetic emboldening -->
 <match target="font">
  <test compare="less_eq" name="weight">
   <const>medium</const>
  </test>
  <test compare="more_eq" name="weight" target="pattern">
   <const>bold</const>
  </test>
  <edit mode="assign" name="embolden">
   <bool>true</bool>
  </edit>
  <edit mode="assign" name="weight">
   <const>bold</const>
  </edit>
 </match>
 <!-- Hinting and rendering -->
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <!-- Arabic: prefer Noto Naskh Arabic system-wide -->
 <match>
  <test compare="contains" name="lang">
   <string>ar</string>
  </test>
  <edit mode="prepend" name="family">
   <string>Noto Naskh Arabic</string>
  </edit>
 </match>
 <alias>
  <family>sans-serif</family>
  <prefer>
   <family>Noto Naskh Arabic</family>
  </prefer>
 </alias>
 <alias>
  <family>serif</family>
  <prefer>
   <family>Noto Naskh Arabic</family>
  </prefer>
 </alias>
 <dir>~/.local/share/fonts</dir>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
</fontconfig>
